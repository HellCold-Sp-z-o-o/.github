name: Bug
description: Report a reproducible defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not submit credentials, personal data, customer data, or security vulnerabilities here.
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Repository, application, agent, integration, or module
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Development
        - Test
        - Production
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: State expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence
      description: Add sanitized logs, screenshots, or references.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, personal data, customer data, and production exports.
          required: true
        - label: This is not a security vulnerability requiring private reporting.
          required: true
