name: Reusable security baseline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect forbidden files and obvious credentials
        shell: bash
        run: |
          set -euo pipefail
          forbidden='\.(rvt|dwg|nwd|nwc|pfx|p12|key)$'
          if find . -type f -not -path './.git/*' | grep -Eiq "$forbidden"; then
            echo "Forbidden binary or key file detected"
            exit 1
          fi
          if grep -RInE --exclude-dir=.git \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|client_secret[[:space:]]*[:=][[:space:]]*[^$<{[:space:]]|api[_-]?key[[:space:]]*[:=][[:space:]]*[^$<{[:space:]])' .; then
            echo "Possible credential detected"
            exit 1
          fi
