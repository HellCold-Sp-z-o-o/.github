name: Reusable repository baseline

on:
  workflow_call:
    inputs:
      source-path:
        description: Path to validate
        required: false
        default: .
        type: string

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Repository baseline
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_PATH"
          test -s README.md
          test -s .github/CODEOWNERS
          if find . -type f -not -path './.git/*' | grep -Eiq '\.(pfx|p12|key|pem|kdbx|tfstate|tfstate\.backup)$'; then
            echo 'A prohibited credential or state file was found.'
            exit 1
          fi
