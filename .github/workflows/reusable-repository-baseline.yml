name: Reusable repository baseline

on:
  workflow_call:
    inputs:
      source-path:
        description: Path to validate
        required: false
        default: .
        type: string

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Repository baseline
        env:
          SOURCE_PATH: ${{ inputs.source-path }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_PATH"
          test -s README.md
          test -s .github/CODEOWNERS
          if find . -type f -not -path './.git/*' | grep -Eiq '\.(pfx|p12|key|pem|kdbx|tfstate|tfstate\.backup)$'; then
            echo 'A prohibited credential or state file was found.'
            exit 1
          fi
